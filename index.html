<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlueMercury Landing Page Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    .header-container {
      width: 100%;
      height: 150px;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 150px;
      border: none;
      display: block;
    }

    .content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: #1c262e;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #666;
      margin-bottom: 20px;
    }

    .cta-button {
      display: inline-block;
      background-color: #000;
      color: #fff;
      padding: 15px 30px;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 600;
      margin-top: 20px;
    }

    .cta-button:hover {
      background-color: #333;
    }
  </style>
</head>
<body>
  <div class="header-container">
    <iframe src="https://bluemercury.com/pages/standalone-header"></iframe>
  </div>

  <div class="content">
    <h1>Welcome to BlueMercury</h1>
    <p>Experience luxury beauty and spa services. Discover premium skincare, makeup, and fragrance from the world's most coveted brands.</p>
    <p>This is a test landing page demonstrating the standalone header integration.</p>
    <a href="#" class="cta-button">Shop Now</a>
  </div>
</body>
</html>
